# Rotary axis (R) add-on for the Turn V2 machine
#
# Drop-in overlay that turns an XY3Z machine into an XY3ZR one.  Include
# it as the LAST line of printer.cfg:
#
#     [include rotary-axis.cfg]
#
# It must come after the machine's own [printer] section, because the
# [printer] block below overrides "kinematics" and adds the rotary
# limits while leaving every other [printer] option alone.  Comment the
# include out and the machine is an XY3Z again, with no other edit.
#
# The axis is called R and is commanded in degrees: "G1 R90" turns 90
# degrees, "G1 X100 R45" rotates and translates together.  R is a
# first-class kinematic axis, so it appears in G1, G92, SET_GCODE_OFFSET,
# GET_POSITION and M114 like any other.
#
# See docs/Turn_Kinematics.md for the full reference.
#
# Copyright (C) 2026  Turn-Motion
#
# This file may be distributed under the terms of the GNU GPLv3 license.

# --- The second board ------------------------------------------------------
#
# Only needed if the rotary stepper is wired to a second MCU.  Find the
# id with:
#
#     ls /dev/serial/by-id/
#
# Pins on this board are then written with the "r:" prefix, as in
# "r:PA0".  If the stepper is on the main board instead, delete this
# section and drop the prefix from the pin names below.
#[mcu r]
#serial: /dev/serial/by-id/usb-Klipper_CHANGE_ME-if00

# --- Kinematics and rotary limits ------------------------------------------
[printer]
kinematics: cartesianxy3zr
# In DEGREES/s and DEGREES/s^2.  The option name follows the axis
# letter, so an axis named "c" would use max_c_velocity instead.
max_r_velocity: 90
max_r_accel: 800

# --- The rotary axis -------------------------------------------------------
#
# Degrees come from the config, not from code: rotation_distance 360
# with a gear_ratio makes one G-code unit equal one degree.  Set
# gear_ratio to the chuck's actual reduction.
#
# endstop_pin is OPTIONAL and selects how R is homed:
#   absent  - R has no home reference.  It is usable over its configured
#             range from startup, G28 skips it, and
#             SET_KINEMATIC_POSITION R=<angle> redefines its zero.
#             This needs [force_move] enable_force_move: True, which the
#             machine config already sets.
#   present - R is homed by G28 like any other axis, and
#             position_endstop, homing_speed and homing_retract_dist
#             apply as usual.
# Start without one: nothing else about the axis changes if an endstop is
# added later.
#
# motion_mode selects how R shares a move with the linear axes:
#   coordinated  (default) R takes its own share of the move time, so a
#                combined move is as slow as its slowest part.  Use this
#                when the rotation has to stay in step with the travel.
#   slaved       the linear axes carry R along and it never makes a
#                combined move longer.  R moving on its own still works
#                and is still held to max_r_velocity / max_r_accel.
#
# position_min and position_max are the only limits an unhomed rotary
# axis needs.  The wide range below means "unbounded in practice"; narrow
# it if the chuck has cabling or a hard stop that must not be passed.
[stepper_r]
step_pin: r:PA0
dir_pin: !r:PA1
enable_pin: !r:PA2
microsteps: 16
rotation_distance: 360
gear_ratio: 6:1
position_min: -100000
position_max: 100000
motion_mode: coordinated
#endstop_pin: ^r:PA3
#position_endstop: 0
#homing_speed: 20
#homing_retract_dist: 0
