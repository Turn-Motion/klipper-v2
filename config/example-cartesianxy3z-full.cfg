# Example configuration for CartesianXY3Z kinematics
# This demonstrates how to configure a printer with X, Y, Z, A, B axes and dual carriage support

[printer]
kinematics: cartesianxy3z
max_velocity: 300
max_accel: 3000
max_z_velocity: 25   # Default max velocity for Z axis
max_z_accel: 100     # Default max acceleration for Z axis

# CartesianXY3Z specific configuration
[cartesianxy3z]
# Axis-specific velocity and acceleration limits
max_z_velocity: 25   # Maximum velocity for Z axis (mm/s)
max_z_accel: 100     # Maximum acceleration for Z axis (mm/s^2)
max_a_velocity: 20   # Maximum velocity for A axis (mm/s), defaults to max_z_velocity if not specified
max_a_accel: 80      # Maximum acceleration for A axis (mm/s^2), defaults to max_z_accel if not specified
max_b_velocity: 20   # Maximum velocity for B axis (mm/s), defaults to max_z_velocity if not specified
max_b_accel: 80      # Maximum acceleration for B axis (mm/s^2), defaults to max_z_accel if not specified
post_homing_z_lift: 62.8  # Distance to lift Z axis after homing (mm)
bypass_z_home_together: False  # Set to True to disable coordinated Z/A/B homing for debugging

# X axis stepper configuration
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 235
homing_speed: 50

# Y axis stepper configuration
[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 235
homing_speed: 50

# Z axis stepper configuration (primary Z)
[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0
position_max: 250
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# A axis stepper configuration (second Z motor)
[stepper_a]
step_pin: PA1
dir_pin: !PA2
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD2
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# B axis stepper configuration (third Z motor)
[stepper_b]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD1
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# Dual carriage configuration (for IDEX setup)
[dual_carriage]
axis: x                      # Dual carriage on X axis
step_pin: PL0
dir_pin: PL2
enable_pin: !PG1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
position_endstop: 235
position_min: 0
position_max: 235
homing_speed: 50

# Extruder configuration
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

# Example T0 and T1 tool configuration for dual carriage
[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1

# Optional safety module configuration
[cartesianxy3z_safety]
joint_ball_diameter: 12.0
wagon_length: 45.0
wagon_rail_z_offset: 5.0
x_distance_between_joints_ab: 516.0
y_distance_plate_to_joint_z: 521.0
y_overhang_plate_to_joints_ab: 5.0
plate_thickness: 9.9
joint_ball_inset: 4.0
alu_mount_plate_thickness: 6.0
joint_mount_thickness: 5.0
y_distance_joints_ab_to_rail: 14.0
x_railspace_ab_inwards: 117.5
x_railspace_ab_outwards: 59.5
y_railspace_z_inwards: 101.1
total_plate_height: 44.15
