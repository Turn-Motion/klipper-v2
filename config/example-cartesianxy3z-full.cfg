# Example configuration for CartesianXY3Z kinematics
# This demonstrates how to configure a printer with X, Y, Z, A, B axes and dual carriage support

[printer]
kinematics: cartesianxy3z
max_velocity: 300
max_accel: 3000
# Velocity and acceleration limits shared by the Z, A, and B bed axes.
# Both can also be changed at runtime with
# SET_VELOCITY_LIMIT Z_VELOCITY=... Z_ACCEL=...
max_z_velocity: 25
max_z_accel: 100

# X axis stepper configuration
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 235
homing_speed: 50

# Y axis stepper configuration
[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 235
homing_speed: 50

# Z axis stepper configuration (primary Z)
[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0
position_max: 250
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# A axis stepper configuration (second Z motor)
[stepper_a]
step_pin: PA1
dir_pin: !PA2
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD2
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# B axis stepper configuration (third Z motor)
[stepper_b]
step_pin: PC7
dir_pin: !PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD1
homing_speed: 15.0
second_homing_speed: 3.0
homing_retract_dist: 3.0

# Dual carriage configuration (for IDEX setup)
[dual_carriage]
axis: x                      # Dual carriage on X axis
step_pin: PL0
dir_pin: PL2
enable_pin: !PG1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
position_endstop: 235
position_min: 0
position_max: 235
homing_speed: 50

# Extruder configuration
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

# Example T0 and T1 tool configuration for dual carriage
[gcode_macro T0]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0

[gcode_macro T1]
gcode:
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1

# Bed geometry safety checks (optional section; defaults match the Turn V2)
[CartesianXY3ZSafety]
#disable_safety_checks: False
y_distance_between_ab_center_and_z: 304.6
printing_area_x_length: 600.0
printing_area_y_length: 300.0
joint_plate_horizontal_distance: 23.0
a_joint_probe_object_height: 28.0
a_joint_probe_value: 7.38125
bed_probe_value: -0.35625
x_railspace_ab_outwards_neutral: 255.0
x_railspace_ab_inwards_neutral: 50.0
y_railspace_z_inwards_neutral: 132.19
extruder_radius: 0.5
extruder_width_tip_to_minus_x: 15.5
extruder_width_tip_to_plus_x: 5.5
extruder_width_tip_to_y: 33.5
z_rail_ab_height_to_top: 14.0
y_rail_ab_innermost: 43.5
safety_z_clearance: 2.0
