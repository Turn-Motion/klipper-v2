# Example configuration for cartesianxy3z safety checks
# Include this section in your printer.cfg file

[cartesianxy3z_safety]
# Joint ball parameters
joint_ball_diameter = 12.0          # s = 12mm
wagon_length = 45.0                 # w = 45mm
wagon_rail_z_offset = 5.0           # z_w = 5mm
x_distance_between_joints_ab = 516.0 # d_x = 516mm
y_distance_plate_to_joint_z = 521.0 # L_y = 521mm
y_overhang_plate_to_joints_ab = 5.0 # L_off = 5mm
plate_thickness = 9.9               # h_plate = 9.9mm

# Printer.cfg parameters
joint_ball_inset = 4.0              # s_in = 4mm
alu_mount_plate_thickness = 6.0     # z_alu = 6mm
joint_mount_thickness = 5.0         # z_mount = 5mm
y_distance_joints_ab_to_rail = 14.0 # y_off = 14mm
x_railspace_ab_inwards = 117.5      # x_in = 117.5mm
x_railspace_ab_outwards = 59.5      # x_out = 59.5mm
y_railspace_z_inwards = 101.1       # y_in = 101.1mm
total_plate_height = 44.15          # h_tot = 44.15mm

# You can use the CHECK_CARTESIANXY3Z_SAFETY command to verify the current position
# Example G-code macro to check safety before a print
[gcode_macro CHECK_SAFETY_BEFORE_PRINT]
gcode:
    CHECK_CARTESIANXY3Z_SAFETY
    {% if printer.cartesianxy3z_safety.is_safe %}
        M117 Position is safe, starting print
        # Continue with your print start commands
    {% else %}
        M117 Safety check failed!
        # Handle the error condition
        RESPOND TYPE=error MSG="Safety check failed. Print canceled."
        # You might want to add additional recovery actions here
    {% endif %}
