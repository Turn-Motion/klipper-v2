dir_pin: !PC13
enable_pin: !PE6
microsteps: 16
rotation_distance: 5
endstop_pin: PC15
homing_retract_dist: 0
position_endstop: -0.5
position_min: -5
position_max: 600
homing_speed: 5
axis: z

# S2
[stepper_a]
