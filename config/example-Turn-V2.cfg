[gcode_macro DEBUG_HOME_X]
gcode:
    RESPOND TYPE=echo MSG="DEBUG: Starting X homing test"
    G28 X
    RESPOND TYPE=echo MSG="DEBUG: X homing completed"
    QUERY_ENDSTOPS

[gcode_macro DEBUG_HOME_Y]
gcode:
    RESPOND TYPE=echo MSG="DEBUG: Starting Y homing test"
    G28 Y
    RESPOND TYPE=echo MSG="DEBUG: Y homing completed"
    QUERY_ENDSTOPS

[gcode_macro DEBUG_STEPPER_X]
gcode:
    RESPOND TYPE=echo MSG="DEBUG: Testing X stepper motor"
    {% set current_pos = printer.toolhead.position %}
    FORCE_MOVE STEPPER=stepper_x DISTANCE=10 VELOCITY=5
    G4 P1000
    FORCE_MOVE STEPPER=stepper_x DISTANCE=-10 VELOCITY=5
    SET_KINEMATIC_POSITION X={current_pos.x}
    RESPOND TYPE=echo MSG="DEBUG: X stepper test completed"

[gcode_macro DEBUG_STEPPER_Y]
gcode:
