dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 5
endstop_pin: PF0
homing_retract_dist: 0
position_endstop: -0.5
position_min: -5
position_max: 600
homing_speed: 5
axis: z

# S3
[stepper_b]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
microsteps: 16
rotation_distance: 5
endstop_pin: PF1
homing_retract_dist: 0
position_endstop: -0.5
position_min: -5
position_max: 600
homing_speed: 5
axis: z

# S4
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
[stepper_y]
step_pin: PB9
dir_pin: PB8
enable_pin: !PB7
microsteps: 16
endstop_pin: PF2
rotation_distance: 40
homing_retract_dist: 0
position_endstop: 0.5
position_min: -16.4
position_max: 480
homing_speed: 50

# S5
[stepper_x]
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13
microsteps: 16
endstop_pin: PF3
rotation_distance: 40
homing_retract_dist: 0
position_endstop: 0.5
position_min: -1
position_max: 400
homing_speed: 50
