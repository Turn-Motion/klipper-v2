# Example configuration for the derived bed joint carriages
#
# The bed is a rigid plate on three ball joints.  The A and B joints
# slide horizontally as the bed tilts, and that slide is fully determined
# by the commanded bed pose through plate rigidity - so the two carriages
# are not degrees of freedom and are never commanded directly.
#
# Add this section to a cartesianxy3z or cartesianxy3zr configuration.
# It changes no G-code: there is no U or V word, the position tuple is
# unchanged, and the carriages follow every bed transform (z_tilt,
# SET_GCODE_OFFSET, bed_mesh, probe lifts) on their own.

[bed_joint_carriages]
# World X of each ball joint with the bed level
a_joint_home_x: -23
b_joint_home_x: 623

# How a move is checked against the carriages' travel limits.
#   sampled    (default) evaluate the carriage path along the move.  The
#              carriage position is nonlinear in the bed pose, so a move
#              whose two endpoints are both in range can still take a
#              carriage off its rail partway through, and the peak rate
#              at the end of a long sweep is about twice the average.
#              This catches both.
#   endpoints  evaluate only the start and end of the move.  Cheaper, and
#              the behaviour of the first implementation.
travel_check: sampled

# What the carriages do while the bed is homing.  Klipper homes by first
# forcing the start position well beyond the axis range, which for a
# single bed motor is a pose the plate cannot physically occupy.
#   detached   (default) take the carriages off the motion queue for the
#              duration.  The plate back-drives them mechanically, and
#              they are re-derived from the true pose afterwards without
#              emitting any steps.
#   attached   leave them on the queue, so they follow the commanded pose
#              through the homing moves as well.
homing_mode: detached

# Velocity and acceleration limits for the carriages.  Default to the bed
# limits (max_z_velocity / max_z_accel).
#max_velocity: 8.4
#max_accel: 300

# The two stepper sections, A side first.  Defaults to stepper_u,stepper_v
#carriages: stepper_u, stepper_v

[stepper_u]
step_pin: PXX
dir_pin: !PXX
enable_pin: !PXX
microsteps: 16
rotation_distance: 5
# REQUIRED, deliberately.  The carriages have no endstop and no encoder,
# so this range is the only thing standing between a commanded bed pose
# and a ball joint being driven off the end of its rail by the bed
# actuators.  0 is the level-bed home position.
position_min: -120
position_max: 120

[stepper_v]
step_pin: PXX
dir_pin: !PXX
enable_pin: !PXX
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120
