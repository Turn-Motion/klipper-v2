# Example configuration for cartesianxy3zr kinematics
#
# The cartesianxy3z machine (an XY gantry over a bed carried by three
# vertical motors) plus a rotary R axis commanded in degrees and planned
# in the same trapezoid as the linear axes:
#
#   G1 R90              turn 90 degrees
#   G1 X100 R45         rotate and translate together
#
# Only the parts that differ from the cartesianxy3z configuration are
# shown here - see example-cartesianxy3z-full.cfg for the rest.

[printer]
kinematics: cartesianxy3zr
max_velocity: 100
max_accel: 3000
# Shared limits for the three vertical bed motors (Z, A and B)
max_z_velocity: 8.4
max_z_accel: 300
# Limits for the rotary axis, in DEGREES/s and DEGREES/s^2.  The option
# name follows the axis letter, so an axis named "c" would use
# max_c_velocity / max_c_accel.
max_r_velocity: 90
max_r_accel: 800

# --- The rotary axis -------------------------------------------------------
#
# Degrees come from the config, not from code: rotation_distance 360 with
# a gear_ratio of 6:1 makes one G-code unit equal one degree.
#
# endstop_pin is OPTIONAL and selects how the axis is homed:
#   present - R is homed by G28 like any other axis, and position_endstop,
#             homing_speed and the rest apply as usual.
#   absent  - R has no home reference.  It is usable over its configured
#             range from startup, G28 skips it, and
#             SET_KINEMATIC_POSITION R=<angle> redefines its zero.
#
# motion_mode selects how R shares a move with the linear axes:
#   coordinated  (default) R has its own share of the move time, so a
#                combined move is as slow as its slowest part.  Use this
#                when the rotation has to stay in step with the travel.
#   slaved       R is carried along by the linear axes and never makes a
#                combined move longer.  R moving on its own still works
#                and is still held to max_r_velocity / max_r_accel.
[stepper_r]
step_pin: PXX
dir_pin: !PXX
enable_pin: !PXX
microsteps: 16
rotation_distance: 360
gear_ratio: 6:1
position_min: -100000
position_max: 100000
motion_mode: coordinated
