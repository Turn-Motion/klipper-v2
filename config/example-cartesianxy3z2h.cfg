# Example configuration fragment for the CartesianXY3Z2H kinematics
#
#   X, Y     nozzle gantry
#   Z, A, B  the three vertical bed actuators (define the bed plane)
#   U, V     the two horizontal bed-joint carriages - DERIVED, not axes
#
# The bed is a rigid plate on three ball joints.  The A and B joints slide
# horizontally in X, and plate rigidity fixes those slides completely for a
# given (Z, A, B) - they are not free degrees of freedom.  Klipper therefore
# computes them internally, exactly the way delta towers are computed.
#
# What this means in practice:
#   * G-code keeps sending X Y Z A B.  There is no U or V word.
#   * U/V never need homing - they take their position from Z/A/B.
#   * U/V automatically follow z_tilt, SET_GCODE_OFFSET, bed_mesh and probe
#     lifts, because they are recomputed from whatever Z/A/B actually are.
#   * U/V do not appear in Mainsail (they are not axes).  They are reported
#     under printer.toolhead.horizontal_carriages for diagnostics.
#
# This file shows only the sections that differ from a cartesianxy3z config.
# Copy the rest (fans, heaters, TMC drivers, macros) from your printer.cfg.

########################################
# Printer
########################################

[printer]
kinematics: cartesianxy3z2h
max_velocity: 100
max_accel: 3000
# Vertical bed actuators Z, A, B
max_z_velocity: 8.4
max_z_accel: 300

########################################
# Derived horizontal carriage geometry
########################################

[cartesianxy3z2h]
# World X of each ball joint with the bed level, matching the reference
# printerkin machine.json.  The A-B joint spacing d_x (646) and their
# midpoint (300) are derived from these two numbers - do not set them
# separately.
a_joint_home_x: -23
b_joint_home_x: 623

# Velocity/acceleration limits for the horizontal carriages.  Both default to
# the corresponding max_z_* value, so an existing config needs no new keys.
# Set them independently once the real mass and lead of the horizontal rails
# are known - check_move() coordinates the XY / ZAB / UV groups so each runs
# at its own maximum and they all finish together.
#
# Note: dU/d(B-A) reaches about 1.9 near maximum roll, so the carriages can
# travel roughly twice as fast as the bed screws.  The limiter accounts for
# this, but the limits need to be real.
#max_h_velocity: 8.4
#max_h_accel: 300

# Set to False to run the machine with the horizontal carriages absent (the
# [stepper_u]/[stepper_v] sections are then not required).
#enable_horizontal_carriages: True

########################################
# The two derived carriages
########################################

# IMPORTANT: these are in SLIDE coordinates - 0 is the position each carriage
# occupies with the bed level, matching printerkin's A_slide / B_slide.
#
# No endstop_pin, no position_endstop, no homing_speed: these steppers are
# never homed.  Their position is set from Z/A/B whenever the toolhead
# position is set (including after G28).
#
# position_min / position_max are the usable slide travel and are checked on
# every move that changes the bed pose.  Replace the placeholders below with
# the real rail travel.

[stepper_u]
# A-side horizontal bed-joint carriage
step_pin: PXX
dir_pin: !PXX
enable_pin: !PXX
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120

[stepper_v]
# B-side horizontal bed-joint carriage
step_pin: PXX
dir_pin: !PXX
enable_pin: !PXX
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120

# Drivers - copy the pattern from your existing [tmc5160 stepper_z] block and
# give each carriage its own cs_pin.
#[tmc5160 stepper_u]
#cs_pin: PXX
#spi_software_sclk_pin: PC6
#spi_software_mosi_pin: PC8
#spi_software_miso_pin: PC7
#run_current: 1.0
#sense_resistor: 0.075
#stealthchop_threshold: 999999

#[tmc5160 stepper_v]
#cs_pin: PXX
#spi_software_sclk_pin: PC6
#spi_software_mosi_pin: PC8
#spi_software_miso_pin: PC7
#run_current: 1.0
#sense_resistor: 0.075
#stealthchop_threshold: 999999

########################################
# Commissioning note
########################################

# Because the carriages are never homed, their physical position must match
# the derived one at startup.  Establish that once mechanically (bed level =>
# both carriages at their slide-zero mark), then the steppers track it.
#
# Useful facts from the geometry, worth knowing before first power-on:
#   * Pitch alone (A == B) produces ZERO carriage travel - verified against
#     the reference solver from -29.5 deg to +29.5 deg of pitch.  Only the
#     passive Z joint slides under pitch.
#   * Carriage travel only appears with roll (A != B), and then it is
#     substantial: about -59 .. +109 mm over the reachable envelope.
