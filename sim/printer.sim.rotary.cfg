# ---------------------------------------------------------------------------
# Klipper SIMULATION config - cartesianxy3zr (the XY3Z machine plus a
# rotary R axis)
# ---------------------------------------------------------------------------
# Everything is inherited from printer.sim.cfg; this file only adds the
# rotary axis and switches the kinematics.  Keeping it thin is the point:
# the two machines differ by a config file, not by a build.
# ---------------------------------------------------------------------------

[include printer.sim.cfg]

[printer]
kinematics: cartesianxy3zr
# Rotary limits, in DEGREES/s and DEGREES/s^2
max_r_velocity: 90
max_r_accel: 800

# --- Rotary axis -----------------------------------------------------------
# Degrees come from the config, not from code: rotation_distance 360 with a
# gear_ratio of 6:1 makes one G-code unit one degree.
#
# No endstop_pin: a rotary chuck has no home reference, so R is usable over
# its configured range from startup and SET_KINEMATIC_POSITION R=0 redefines
# its zero.  Give it an endstop_pin instead and G28 homes it like any axis.
#
# motion_mode: coordinated - R takes its own share of the move time, so a
# combined move is as slow as its slowest part.  "slaved" instead lets the
# linear axes carry R along without ever extending the move.
[stepper_r]
step_pin: gpio34
dir_pin: gpio35
enable_pin: !gpio36
microsteps: 16
rotation_distance: 360
gear_ratio: 6:1
position_min: -100000
position_max: 100000
motion_mode: coordinated
