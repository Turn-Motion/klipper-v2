# ─────────────────────────────────────────────────────────────────────────────
# Klipper SIMULATION config - derived U/V carriages (realtime Linux-MCU mode)
# ─────────────────────────────────────────────────────────────────────────────
# Purpose  : time estimation, motion planning validation, future vis backend
# Hardware : No physical motion hardware; Klippy talks to Linux MCU socket
#
# ⚠ IMPORTANT — keep motion parameters in sync with your real printer.cfg:
#     max_velocity, max_accel, max_z_velocity, max_z_accel,
#     minimum_cruise_ratio, square_corner_velocity
#
# Pin names use Linux MCU gpio numbering (gpio0..gpioN). They are validated
# against out/klipper.dict at startup but never touch real hardware.
# ─────────────────────────────────────────────────────────────────────────────

[mcu]
# Klippy connects to the Linux-process MCU socket exposed by out/klipper.elf
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesianxy3z2h
# ↓↓ Match these to your real printer.cfg ↓↓
max_velocity: 100
max_accel: 3000
max_z_velocity: 8.4
max_z_accel: 300
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

# ── X axis ───────────────────────────────────────────────────────────────────
# ── Horizontal bed-joint carriages (U/V) ─────────────────────────────────────
# These are NOT G-code axes.  Their position is derived from the commanded
# (Z, A, B) by plate rigidity - see klippy/chelper/kin_cartesianxy3z2h.c.
# G-code keeps sending X Y Z A B only.
[cartesianxy3z2h]
# World X of each ball joint with the bed level (from the reference
# machine.json).  d_x = 646 and the midpoint 300 follow from these.
a_joint_home_x: -23
b_joint_home_x: 623
# Carriage travel limits; default to the Z limits if omitted.
max_h_velocity: 8.4
max_h_accel: 300

# Slide coordinates: 0 == the level-bed home position.
# No endstop and no homing - the position is derived.
#
# position_min/position_max are REQUIRED.  With no endstop and no encoder
# they are the only thing preventing a commanded bed pose from driving the
# ball joint off the end of its rail, so they are never defaulted.  The
# check samples along the move, not just its endpoints, because U(s) can
# have an interior extremum.
#
# TODO(hardware): +/-120 is a PLACEHOLDER.  Measure the real slide travel
# during the plate-out bench session (FORCE_MOVE to each hard stop) and put
# the measured numbers here.  Same for rotation_distance and the pins.
[stepper_u]
step_pin: gpio40
dir_pin: gpio41
enable_pin: !gpio42
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120

[stepper_v]
step_pin: gpio44
dir_pin: gpio45
enable_pin: !gpio46
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3
homing_retract_dist: 0
position_endstop: -32.5
position_min: -32.5
position_max: 570
homing_speed: 80

# ── Y axis ───────────────────────────────────────────────────────────────────
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: gpio7
homing_retract_dist: 0
position_endstop: -97.4
position_min: -97.4
position_max: 280
homing_speed: 60

# ── Z axis ───────────────────────────────────────────────────────────────────
[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 5
endstop_pin: gpio11
homing_retract_dist: 0
position_endstop: 438.8
position_min: -90
position_max: 438.8
homing_speed: 5

# ── A axis (bed tilt 1) ──────────────────────────────────────────────────────
[stepper_a]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 5
endstop_pin: gpio15
homing_retract_dist: 0
position_endstop: 439
position_min: -90
position_max: 439
homing_speed: 5

# ── B axis (bed tilt 2) ──────────────────────────────────────────────────────
[stepper_b]
step_pin: gpio16
dir_pin: gpio17
enable_pin: !gpio18
microsteps: 16
rotation_distance: 5
endstop_pin: gpio19
homing_retract_dist: 0
position_endstop: 439.8
position_min: -90
position_max: 439.8
homing_speed: 5

[dual_carriage]
axis: x
safe_distance: 50
step_pin: gpio25
dir_pin: gpio26
enable_pin: !gpio27
microsteps: 16
endstop_pin: gpio28
rotation_distance: 40
homing_retract_dist: 0
position_min: 50
position_max: 655
position_endstop: 655
homing_speed: 80

# ── Extruder ─────────────────────────────────────────────────────────────────
[extruder]
step_pin: gpio20
dir_pin: gpio21
enable_pin: !gpio22
microsteps: 16
rotation_distance: 8
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio23
# temperature_host reads /sys/class/thermal — available in Linux containers
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_hotend
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114
min_extrude_temp: -100
min_temp: -100
max_temp: 350

[extruder1]
step_pin: gpio29
dir_pin: gpio30
enable_pin: !gpio31
microsteps: 16
rotation_distance: 7.44
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio32
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_hotend
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114
min_extrude_temp: -100
min_temp: -100
max_temp: 350

# ── Heated bed ───────────────────────────────────────────────────────────────
[heater_bed]
heater_pin: gpio33
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_bed
control: watermark
min_temp: -100
max_temp: 150

[firmware_retraction]
retract_length: 2
retract_speed: 20
unretract_extra_length: 0
unretract_speed: 10

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 86400

[CartesianXY3ZSafety]
disable_safety_checks: True
y_distance_between_ab_center_and_z: 304.6
printing_area_x_length: 600.0
printing_area_y_length: 300.0
joint_plate_horizontal_distance: 23.0
a_joint_probe_object_height: 28.0
a_joint_probe_value: 7.38125
bed_probe_value: -0.35625
x_railspace_ab_outwards_neutral: 255.0
x_railspace_ab_inwards_neutral: 50.0
y_railspace_z_inwards_neutral: 170.0
extruder_radius: 0.5
extruder_width_tip_to_minus_x: 15.5
extruder_width_tip_to_plus_x: 5.5
extruder_width_tip_to_y: 33.5
z_rail_ab_height_to_top: 14.0
y_rail_ab_innermost: 43.5
safety_z_clearance: 2.0

# ── Bed levelling ────────────────────────────────────────────────────────────
# Also a runtime assertion: z_tilt refuses to start unless it finds exactly
# len(z_positions) == 3 bed steppers, so klippy will not come up if the
# derived carriages (stepper_u / stepper_v) leak into that set.
[z_tilt]
z_positions:
  300, 323     # Z motor  (back centre)
  -23, 20.5    # A motor  (front left)
  623, 20.5    # B motor  (front right)
points:
  300, 280
  100, 80
  500, 80
speed: 50
horizontal_move_z: 5
retries: 1
retry_tolerance: 1

# ── Virtual SD card ──────────────────────────────────────────────────────────
# Drop .gcode files in the ./gcode/ host directory (mounted by docker-compose)
[virtual_sdcard]
path: /opt/printer_data/gcodes

[pause_resume]

[display_status]

[respond]

[gcode_macro T0]
gcode:
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 2) and printer.toolhead.position.a < (printer.toolhead.axis_maximum.a - 2) and printer.toolhead.position.b < (printer.toolhead.axis_maximum.b - 2) %}
      G1 Z{printer.toolhead.position.z + 2} A{printer.toolhead.position.a + 2} B{printer.toolhead.position.b + 2} F1000
    {% endif %}
    M400
    {% if printer.toolhead.extruder != "extruder" %}
      G1 X654.5 F2000
      SET_DUAL_CARRIAGE CARRIAGE=0
      ACTIVATE_EXTRUDER EXTRUDER=extruder
      G92 E0
      SET_GCODE_OFFSET Y_ADJUST=6 Z_ADJUST=-0.8 A_ADJUST=-0.8 B_ADJUST=-0.8
      SET_RETRACTION RETRACT_LENGTH=2 RETRACT_SPEED=20 UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED=10
    {% endif %}
    M118 T0 active

[gcode_macro T1]
gcode:
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 2) and printer.toolhead.position.a < (printer.toolhead.axis_maximum.a - 2) and printer.toolhead.position.b < (printer.toolhead.axis_maximum.b - 2) %}
      G1 Z{printer.toolhead.position.z + 2} A{printer.toolhead.position.a + 2} B{printer.toolhead.position.b + 2} F1000
    {% endif %}
    M400
    {% if printer.toolhead.extruder != "extruder1" %}
      G1 X{printer.toolhead.axis_minimum.x + 0.5} F2000
      SET_DUAL_CARRIAGE CARRIAGE=1
      ACTIVATE_EXTRUDER EXTRUDER=extruder1
      G92 E0
      SET_GCODE_OFFSET Y_ADJUST=-6 Z_ADJUST=0.8 A_ADJUST=0.8 B_ADJUST=0.8
      SET_RETRACTION RETRACT_LENGTH=30 RETRACT_SPEED=10 UNRETRACT_EXTRA_LENGTH=10 UNRETRACT_SPEED=10
    {% endif %}
    M118 T1 active

[gcode_macro SNIP]
# Sim stub: no servo hardware — logs the call but does nothing physical
gcode:
    M400
    M118 SNIP (sim no-op)
    G1 E-30 F5000

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
    {% set retract = client.cancel_retract|default(5.0)|abs %}
    {% set park_x = "" if (client.park_at_cancel_x|default(none) is none)
    else "X=" ~ client.park_at_cancel_x %}
    {% set park_y = "" if (client.park_at_cancel_y|default(none) is none)
    else "Y=" ~ client.park_at_cancel_y %}
    {% set custom_park = park_x|length > 0 or park_y|length > 0 %}
    {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
    {% endif %}
    {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} {% endif %}
    _CLIENT_RETRACT LENGTH={retract}
    TURN_OFF_HEATERS
    M106 S0
    {client.user_cancel_macro|default("")}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = client.idle_timeout|default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
                else True if params.RESTORE|default(1)|int == 1 else False %}
  ##### end of definitions #####
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE enter raw=%s" % (printer.toolhead.estimated_print_time|float, rawparams)}'
  M118 [RFLDBG t={printer.toolhead.estimated_print_time}] PAUSE enter
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_x VALUE={printer.gcode_move.gcode_position.x}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_y VALUE={printer.gcode_move.gcode_position.y}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_z VALUE={printer.gcode_move.gcode_position.z}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_a VALUE={printer.gcode_move.gcode_position.a}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_b VALUE={printer.gcode_move.gcode_position.b}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_file_position VALUE={printer.virtual_sdcard.file_position|default(-1)|int}
  M118 Pause position: X{printer.gcode_move.gcode_position.x} Y{printer.gcode_move.gcode_position.y} Z{printer.gcode_move.gcode_position.z} A{printer.gcode_move.gcode_position.a} B{printer.gcode_move.gcode_position.b} FILEPOS={printer.virtual_sdcard.file_position|default(-1)|int}
  {% if idle_timeout > 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE before PAUSE_BASE" % (printer.toolhead.estimated_print_time|float)}'
  PAUSE_BASE
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE after PAUSE_BASE" % (printer.toolhead.estimated_print_time|float)}'
  {client.user_pause_macro|default("")}
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE before SNIP" % (printer.toolhead.estimated_print_time|float)}'
  SNIP
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE after SNIP" % (printer.toolhead.estimated_print_time|float)}'
  M400
  G1 Z350 A350 B350 F504
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE after ZAB park-lift" % (printer.toolhead.estimated_print_time|float)}'
  M400
  _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] PAUSE end" % (printer.toolhead.estimated_print_time|float)}'
  M118 [RFLDBG t={printer.toolhead.estimated_print_time}] PAUSE end

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
variable_line_seek_pending: False
variable_line_target_x: 300.0
variable_line_target_y: 0.0
variable_line_target_z: 300.0
variable_line_target_a: 300.0
variable_line_target_b: 300.0
variable_resume_x: 300.0
variable_resume_y: 0.0
variable_resume_z: 300.0
variable_resume_a: 300.0
variable_resume_b: 300.0
variable_pause_file_position: -1
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                    else printer[printer.toolhead.extruder].can_extrude %}
  {% set cur_filepos = printer.virtual_sdcard.file_position|default(-1)|int %}
  {% set seek_detected = pause_file_position|int >= 0 and cur_filepos != (pause_file_position|int) %}
  {% set target_x = line_target_x if line_seek_pending else resume_x %}
  {% set target_y = line_target_y if line_seek_pending else resume_y %}
  {% set target_z = line_target_z if line_seek_pending else resume_z %}
  {% set target_a = line_target_a if line_seek_pending else resume_a %}
  {% set target_b = line_target_b if line_seek_pending else resume_b %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####

  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME enter: paused=%s line_seek_pending=%s seek_detected=%s filepos=%d pause_filepos=%d" % (printer.toolhead.estimated_print_time|float, printer.pause_resume.is_paused, line_seek_pending, seek_detected, cur_filepos, pause_file_position|int)}'
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME targets selected: X=%.3f Y=%.3f Z=%.3f A=%.3f B=%.3f" % (printer.toolhead.estimated_print_time|float, target_x, target_y, target_z, target_a, target_b)}'
  M118 [RFLDBG t={printer.toolhead.estimated_print_time}] RESUME enter pending={line_seek_pending} raw={rawparams}
  #### Printer coming from timeout idle state ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer coming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}
  {% if runout_resume %}
    {% if do_resume %}
      {% if seek_detected and not line_seek_pending %}
        RESPOND TYPE=error MSG='{"[RFLDBG] Resume blocked: SD position changed while paused but line_seek_pending=False. Use RESUME_FROM_LINE S=... X=... Y=... Z=... A=... B=..."}'
        M118 [RFLDBG t={printer.toolhead.estimated_print_time}] BLOCKED normal RESUME after M26 seek
      {% else %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %}
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME running _RESUME_APPROACH_MOVE" % (printer.toolhead.estimated_print_time|float)}'
      _RESUME_APPROACH_MOVE X={target_x} Y={target_y} Z={target_z} A={target_a} B={target_b} VELOCITY={params.VELOCITY|default(sp_move)}
      {% if line_seek_pending %}
        RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME branch=line-seek (MOVE=0, M24)" % (printer.toolhead.estimated_print_time|float)}'
        M118 [RFLDBG t={printer.toolhead.estimated_print_time}] RESUME branch line-seek
        RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=0
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_seek_pending VALUE=False
        CLEAR_PAUSE
        M24
      {% else %}
        RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME branch=normal RESUME_BASE" % (printer.toolhead.estimated_print_time|float)}'
        M118 [RFLDBG t={printer.toolhead.estimated_print_time}] RESUME branch normal
        RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
      {% endif %}
      {% endif %}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}
  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _RESUME_APPROACH_MOVE]
description: Safe resume approach from parked pause position to target XYZAB
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = params.VELOCITY|default(client.speed_move|default(velocity))|float %}
  {% set clearance = params.CLEARANCE|default(client.resume_clearance|default(12.0))|float %}
  {% set rot_eps = client.resume_rotation_epsilon|default(0.05)|float %}

  {% set tx = params.X|float %}
  {% set ty = params.Y|float %}
  {% set tz = params.Z|float %}
  {% set ta = params.A|float %}
  {% set tb = params.B|float %}

  {% set maxz = printer.toolhead.axis_maximum.z %}
  {% set maxa = printer.toolhead.axis_maximum.a %}
  {% set maxb = printer.toolhead.axis_maximum.b %}

  {% set iz = [tz + clearance, maxz]|min %}
  {% set il = [tz + clearance, maxa, maxb]|min %}
  {% set ra = [ta + clearance, maxa]|min %}
  {% set rb = [tb + clearance, maxb]|min %}
  {% set has_rotation = (ta - tz)|abs > rot_eps or (tb - tz)|abs > rot_eps %}

  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] APPROACH input: X=%.3f Y=%.3f Z=%.3f A=%.3f B=%.3f F=%.1f" % (printer.toolhead.estimated_print_time|float, tx, ty, tz, ta, tb, sp_move * 60)}'
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] APPROACH computed: has_rotation=%s iz=%.3f il=%.3f ra=%.3f rb=%.3f" % (printer.toolhead.estimated_print_time|float, has_rotation, iz, il, ra, rb)}'
  M118 [RFLDBG t={printer.toolhead.estimated_print_time}] APPROACH has_rotation={has_rotation}

  G90
  RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] APPROACH step: XY move" % (printer.toolhead.estimated_print_time|float)}'
  G1 X{tx} Y{ty} F{sp_move * 60}
  {% if has_rotation %}
    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] APPROACH step: staged ZAB move" % (printer.toolhead.estimated_print_time|float)}'
    G1 Z{iz} A{il} B{il} F{sp_move * 60}
    G1 Z{iz} A{ra} B{rb} F{sp_move * 60}
    G1 Z{tz} A{ta} B{tb} F{sp_move * 60}
  {% else %}
    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] APPROACH step: direct ZAB move" % (printer.toolhead.estimated_print_time|float)}'
    G1 Z{tz} A{ta} B{tb} F{sp_move * 60}
  {% endif %}

[gcode_macro RESUME_FROM_LINE]
description: Seek to byte offset and resume with safe approach from provided absolute XYZAB
gcode:
  {% if params.S is not defined %}
    RESPOND TYPE=error MSG='{"RESUME_FROM_LINE requires S=<byte_offset>"}'
  {% elif not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG='{"RESUME_FROM_LINE requires printer to be paused"}'
  {% else %}
    {% set r = printer['gcode_macro RESUME'] %}
    {% set tx = params.X|default(r.resume_x)|float %}
    {% set ty = params.Y|default(r.resume_y)|float %}
    {% set tz = params.Z|default(r.resume_z)|float %}
    {% set ta = params.A|default(r.resume_a)|float %}
    {% set tb = params.B|default(r.resume_b)|float %}

    RESPOND TYPE=echo MSG='{"RESUME_FROM_LINE received: S=%d X=%.3f Y=%.3f Z=%.3f A=%.3f B=%.3f" % (params.S|int, tx, ty, tz, ta, tb)}'
    M118 RESUME_FROM_LINE S={params.S|int} X={tx} Y={ty} Z={tz} A={ta} B={tb}
    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME_FROM_LINE begin: paused=%s old_pending=%s" % (printer.toolhead.estimated_print_time|float, printer.pause_resume.is_paused, r.line_seek_pending)}'
    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME_FROM_LINE stored-resume: X=%.3f Y=%.3f Z=%.3f A=%.3f B=%.3f" % (printer.toolhead.estimated_print_time|float, r.resume_x, r.resume_y, r.resume_z, r.resume_a, r.resume_b)}'

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_target_x VALUE={tx}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_target_y VALUE={ty}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_target_z VALUE={tz}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_target_a VALUE={ta}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_target_b VALUE={tb}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=line_seek_pending VALUE=True

    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME_FROM_LINE set targets + pending=True" % (printer.toolhead.estimated_print_time|float)}'
    M118 [RFLDBG t={printer.toolhead.estimated_print_time}] RFL set pending=True S={params.S|int}

    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME_FROM_LINE issuing M26 S=%d" % (printer.toolhead.estimated_print_time|float, params.S|int)}'
    M26 S{params.S|int}
    RESPOND TYPE=echo MSG='{"[RFLDBG t=%.3f] RESUME_FROM_LINE invoking RESUME with rawparams" % (printer.toolhead.estimated_print_time|float)}'
    RESUME {rawparams}
  {% endif %}

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
    {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
    {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
    {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
    {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
    {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
    else params.LAYER is defined %}
    {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
    {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer = { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer = { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
    {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"pause_next_layer triggered by %s" % pause_next_layer.call}'
    {pause_next_layer.call}
    SET_PAUSE_NEXT_LAYER ENABLE=0
    {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"pause_at_layer [%d] triggered by %s" % (pause_at_layer.layer, pause_at_layer.call)}'
    {pause_at_layer.call}
    SET_PAUSE_AT_LAYER ENABLE=0
    {% endif %}
    SET_PRINT_STATS_INFO_BASE {rawparams}

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
    {% set use_custom     = client.use_custom_pos|default(false)|lower == 'true' %}
    {% set custom_park_x  = client.custom_park_x|default(0.0) %}
    {% set custom_park_y  = client.custom_park_y|default(0.0) %}
    {% set park_dz        = client.custom_park_dz|default(2.0)|abs %}
    {% set sp_hop         = client.speed_hop|default(15) * 60 %}
    {% set sp_move        = client.speed_move|default(velocity) * 60 %}
    {% set origin    = printer.gcode_move.homing_origin %}
    {% set act       = printer.gcode_move.gcode_position %}
    {% set max       = printer.toolhead.axis_maximum %}
    {% set z_pos = act.z if 'z' in act else 0 %}
    {% set a_pos = act.a if 'a' in act else 0 %}
    {% set b_pos = act.b if 'b' in act else 0 %}
    {% set max_zab = [z_pos, a_pos, b_pos]|max %}
    {% set min_pos_max = [max.z, max.a, max.b]|min %}
    _CLIENT_RETRACT
    {% set x_center = (max.x + origin.x) / 2 %}
    {% set y_park = origin.y - 5 %}
    G1 X{x_center} Y{y_park} F{sp_move}

[gcode_macro _CLIENT_EXTRUDE]
description: Extrudes, if the extruder is hot enough
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set use_fw_retract = (client.use_fw_retract|default(false)|lower == 'true') and (printer.firmware_retraction is defined) %}
    {% set length = params.LENGTH|default(client.unretract)|default(1.0)|float %}
    {% set speed = params.SPEED|default(client.speed_unretract)|default(35) %}
    {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
    {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
    {% if use_fw_retract %}
    {% if length < 0 %}
    G10
    {% else %}
    G11
    {% endif %}
    {% else %}
    M83
    G1 E{length} F{(speed|float|abs) * 60}
    {% if absolute_extrude %}
    M82
    {% endif %}
    {% endif %}
    {% else %}
    RESPOND TYPE=echo MSG='{"\"%s\" not hot enough" % printer.toolhead.extruder}'
    {% endif %}
    {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Retracts, if the extruder is hot enough
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set length = params.LENGTH|default(client.retract)|default(1.0)|float %}
    {% set speed = params.SPEED|default(client.speed_retract)|default(35) %}
    _CLIENT_EXTRUDE LENGTH=-{length|float|abs} SPEED={speed|float|abs}

[gcode_macro _CLIENT_LINEAR_MOVE]
description: Linear move with save and restore of the gcode state
gcode:
    {% set x_move = "X" ~ params.X if params.X is defined else "" %}
    {% set y_move = "Y" ~ params.Y if params.Y is defined else "" %}
    {% set z_move = "Z" ~ params.Z if params.Z is defined else "" %}
    {% set a_move = "A" ~ params.A if params.A is defined else "" %}
    {% set b_move = "B" ~ params.B if params.B is defined else "" %}
    {% set e_move = "E" ~ params.E if params.E is defined else "" %}
    {% set rate = "F" ~ params.F if params.F is defined else "" %}
    {% set ABSOLUTE = params.ABSOLUTE | default(0) | int != 0 %}
    {% set ABSOLUTE_E = params.ABSOLUTE_E | default(0) | int != 0 %}
    SAVE_GCODE_STATE NAME=_client_movement
    {% if x_move or y_move or z_move or a_move or b_move %}
    G9{ 0 if ABSOLUTE else 1 }
    {% endif %}
    {% if e_move %}
    M8{ 2 if ABSOLUTE_E else 3 }
    {% endif %}
    G1 { x_move } { y_move } { z_move } { a_move } { b_move } { e_move } { rate }
    RESTORE_GCODE_STATE NAME=_client_movement

[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro CHECK_EXTRUDER]
gcode:
  {% if printer.toolhead.extruder == "extruder" %}
    M118 T0
  {% elif printer.toolhead.extruder == "extruder1" %}
    M118 T1
  {% else %}
    M118 unknown active extruder
  {% endif %}

# ── Print time estimator ─────────────────────────────────────────────────────
# Exposes the estimate_file API endpoint on the klippy socket/TCP port.
# Spawns an isolated batch subprocess per request — live printer state is
# never touched.
[print_estimator]
dictionary_path: /klipper/out/klipper.dict
gcode_dir: /opt/printer_data/gcodes
