# ---------------------------------------------------------------------------
# Klipper SIMULATION config - cartesianxy3z with the derived bed joint
# carriages (U and V)
# ---------------------------------------------------------------------------
# Everything is inherited from printer.sim.cfg.  The carriages are not
# G-code axes: the same G-code runs on this profile and on the baseline,
# which is exactly what the verification compares.
# ---------------------------------------------------------------------------

[include printer.sim.cfg]

# --- Derived horizontal bed joint carriages --------------------------------
# Their position follows the commanded bed pose through plate rigidity, so
# they are never homed and never commanded directly.
#
# travel_check: sampled   - evaluate the carriage path along the move, which
#                           catches an interior rail overrun and the true
#                           peak rate.  "endpoints" checks only the ends.
# homing_mode: detached   - take the carriages off the motion queue while the
#                           bed homes (the plate back-drives them).
#                           "attached" drives them from the commanded pose.
[bed_joint_carriages]
a_joint_home_x: -23
b_joint_home_x: 623
travel_check: sampled
homing_mode: detached

[stepper_u]
step_pin: gpio34
dir_pin: gpio35
enable_pin: !gpio36
microsteps: 16
rotation_distance: 5
# REQUIRED: the carriages have no endstop and no encoder, so this range is
# the only guard against a joint being driven off the end of its rail.
position_min: -120
position_max: 120

[stepper_v]
step_pin: gpio37
dir_pin: gpio38
enable_pin: !gpio39
microsteps: 16
rotation_distance: 5
position_min: -120
position_max: 120
