# ---------------------------------------------------------------------------
# Klipper SIMULATION config - bed levelling without a probe
# ---------------------------------------------------------------------------
# Everything is inherited from printer.sim.cfg; this file only adds the
# levelling sections.  There is deliberately NO [probe]: without one,
# Z_TILT_ADJUST falls back to manual probing, so the trigger height at
# each point comes from the g-code rather than from a sensor.  That is
# what makes the levelling direction testable in a simulator - the
# g-code states what the bed looks like, and the only question left is
# what the code does about it.
#
# Run it with gcode/ztilt_sign_check.gcode.
# ---------------------------------------------------------------------------

[include printer.sim.cfg]

# Needed for the manual probing fallback: it is the object that holds the
# ACCEPT / TESTZ session state.
[manual_probe]

# --- Bed levelling ---------------------------------------------------------
# The screw positions are the production machine's.  They are geometry for
# the plane fit only; nothing moves to them.  The probe points are inside
# the simulated machine's travel.
[z_tilt]
z_positions:
  300, 323      # Z motor (centre rear)
  -23, 20.5     # A motor (front left)
  623, 20.5     # B motor (front right)
points:
  300, 250      # rear centre
  100, 80       # front left
  500, 80       # front right
horizontal_move_z: 5
speed: 50
retries: 0
