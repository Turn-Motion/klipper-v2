# ─────────────────────────────────────────────────────────────────────────────
# Klipper SIMULATION config  (realtime Linux-MCU mode)
# ─────────────────────────────────────────────────────────────────────────────
# Purpose  : time estimation, motion planning validation, future vis backend
# Hardware : No physical motion hardware; Klippy talks to Linux MCU socket
#
# ⚠ IMPORTANT — keep motion parameters in sync with your real printer.cfg:
#     max_velocity, max_accel, max_z_velocity, max_z_accel,
#     minimum_cruise_ratio, square_corner_velocity
#
# Pin names use Linux MCU gpio numbering (gpio0..gpioN). They are validated
# against out/klipper.dict at startup but never touch real hardware.
# ─────────────────────────────────────────────────────────────────────────────

[mcu]
# Klippy connects to the Linux-process MCU socket exposed by out/klipper.elf
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesianxy3z
# ↓↓ Match these to your real printer.cfg ↓↓
max_velocity: 100
max_accel: 3000
max_z_velocity: 8.4
max_z_accel: 300
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

# ── X axis ───────────────────────────────────────────────────────────────────
[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3
homing_retract_dist: 0
position_endstop: -32.5
position_min: -32.5
position_max: 570
homing_speed: 80

# ── Y axis ───────────────────────────────────────────────────────────────────
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: gpio7
homing_retract_dist: 0
position_endstop: -97.4
position_min: -97.4
position_max: 280
homing_speed: 60

# ── Z axis ───────────────────────────────────────────────────────────────────
[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 5
endstop_pin: gpio11
homing_retract_dist: 0
position_endstop: 438.8
position_min: -90
position_max: 438.8
homing_speed: 5

# ── A axis (bed tilt 1) ──────────────────────────────────────────────────────
[stepper_a]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 5
endstop_pin: gpio15
homing_retract_dist: 0
position_endstop: 439
position_min: -90
position_max: 439
homing_speed: 5

# ── B axis (bed tilt 2) ──────────────────────────────────────────────────────
[stepper_b]
step_pin: gpio16
dir_pin: gpio17
enable_pin: !gpio18
microsteps: 16
rotation_distance: 5
endstop_pin: gpio19
homing_retract_dist: 0
position_endstop: 439.8
position_min: -90
position_max: 439.8
homing_speed: 5

[dual_carriage]
axis: x
safe_distance: 50
step_pin: gpio25
dir_pin: gpio26
enable_pin: !gpio27
microsteps: 16
endstop_pin: gpio28
rotation_distance: 40
homing_retract_dist: 0
position_min: 50
position_max: 655
position_endstop: 655
homing_speed: 80

# ── Extruder ─────────────────────────────────────────────────────────────────
[extruder]
step_pin: gpio20
dir_pin: gpio21
enable_pin: !gpio22
microsteps: 16
rotation_distance: 8
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio23
# temperature_host reads /sys/class/thermal — available in Linux containers
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_hotend
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114
min_extrude_temp: -100
min_temp: -100
max_temp: 350

[extruder1]
step_pin: gpio29
dir_pin: gpio30
enable_pin: !gpio31
microsteps: 16
rotation_distance: 7.44
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio32
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_hotend
control: pid
pid_kp: 22.2
pid_ki: 1.08
pid_kd: 114
min_extrude_temp: -100
min_temp: -100
max_temp: 350

# ── Heated bed ───────────────────────────────────────────────────────────────
[heater_bed]
heater_pin: gpio33
sensor_type: temperature_host
sensor_path: /tmp/sim_temp_bed
control: watermark
min_temp: -100
max_temp: 150

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 86400

[CartesianXY3ZSafety]
disable_safety_checks: True
y_distance_between_ab_center_and_z: 304.6
printing_area_x_length: 600.0
printing_area_y_length: 300.0
joint_plate_horizontal_distance: 23.0
a_joint_probe_object_height: 28.0
a_joint_probe_value: 7.38125
bed_probe_value: -0.35625
x_railspace_ab_outwards_neutral: 255.0
x_railspace_ab_inwards_neutral: 50.0
y_railspace_z_inwards_neutral: 170.0
extruder_radius: 0.5
extruder_width_tip_to_minus_x: 15.5
extruder_width_tip_to_plus_x: 5.5
extruder_width_tip_to_y: 33.5
z_rail_ab_height_to_top: 14.0
y_rail_ab_innermost: 43.5
safety_z_clearance: 2.0

# ── Virtual SD card ──────────────────────────────────────────────────────────
# Drop .gcode files in the ./gcode/ host directory (mounted by docker-compose)
[virtual_sdcard]
path: /opt/printer_data/gcodes

[pause_resume]

[display_status]

[respond]

[gcode_macro CANCEL_PRINT]
description: Cancel the active simulated print
rename_existing: CANCEL_PRINT_BASE
gcode:
	TURN_OFF_HEATERS
	CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the active simulated print
rename_existing: PAUSE_BASE
gcode:
	PAUSE_BASE

[gcode_macro RESUME]
description: Resume the active simulated print
rename_existing: RESUME_BASE
gcode:
	RESUME_BASE

# ── Print time estimator ─────────────────────────────────────────────────────
# Exposes the estimate_file API endpoint on the klippy socket/TCP port.
# Spawns an isolated batch subprocess per request — live printer state is
# never touched.
[print_estimator]
dictionary_path: /klipper/out/klipper.dict
gcode_dir: /opt/printer_data/gcodes
