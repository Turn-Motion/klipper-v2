# ─────────────────────────────────────────────────────────────────────────────
# Klipper SIMULATION config  (--debugoutput mode)
# ─────────────────────────────────────────────────────────────────────────────
# Purpose  : time estimation, motion planning validation, future vis backend
# Hardware : NONE — all MCU commands are discarded to /tmp/klipper-mcu.out
#
# ⚠ IMPORTANT — keep motion parameters in sync with your real printer.cfg:
#     max_velocity, max_accel, max_z_velocity, max_z_accel,
#     minimum_cruise_ratio, square_corner_velocity
#
# Pin names use Linux MCU gpio numbering (gpio0..gpioN). They are validated
# against out/klipper.dict at startup but never touch real hardware.
# ─────────────────────────────────────────────────────────────────────────────

[mcu]
# Points to the Linux MCU binary; klippy auto-loads out/klipper.dict from
# the same path. No serial connection is made in --debugoutput mode.
serial: /klipper/out/klipper.elf
baud: 250000

[printer]
kinematics: cartesianxy3z
# ↓↓ Match these to your real printer.cfg ↓↓
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

# ── X axis ───────────────────────────────────────────────────────────────────
[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50

# ── Y axis ───────────────────────────────────────────────────────────────────
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: gpio7
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 50

# ── Z axis ───────────────────────────────────────────────────────────────────
[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: gpio11
position_endstop: 0
position_min: -5
position_max: 500
homing_speed: 10

# ── A axis (bed tilt 1) ──────────────────────────────────────────────────────
[stepper_a]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 8
endstop_pin: gpio15
position_endstop: 0
position_min: -5
position_max: 500
homing_speed: 10

# ── B axis (bed tilt 2) ──────────────────────────────────────────────────────
[stepper_b]
step_pin: gpio16
dir_pin: gpio17
enable_pin: !gpio18
microsteps: 16
rotation_distance: 8
endstop_pin: gpio19
position_endstop: 0
position_min: -5
position_max: 500
homing_speed: 10

# ── Extruder ─────────────────────────────────────────────────────────────────
[extruder]
step_pin: gpio20
dir_pin: gpio21
enable_pin: !gpio22
microsteps: 16
rotation_distance: 33.0
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: gpio23
# temperature_host reads /sys/class/thermal — available in Linux containers
sensor_type: temperature_host
control: pid
pid_kp: 26.0
pid_ki: 1.0
pid_kd: 200.0
min_extrude_temp: 0
min_temp: 0
max_temp: 300

# ── Heated bed ───────────────────────────────────────────────────────────────
[heater_bed]
heater_pin: gpio24
sensor_type: temperature_host
control: watermark
min_temp: 0
max_temp: 150

# ── Virtual SD card ──────────────────────────────────────────────────────────
# Drop .gcode files in the ./gcode/ host directory (mounted by docker-compose)
[virtual_sdcard]
path: /gcode

# ── Print time estimator ─────────────────────────────────────────────────────
# Exposes the estimate_file API endpoint on the klippy socket/TCP port.
# Spawns an isolated batch subprocess per request — live printer state is
# never touched.
[print_estimator]
dictionary_path: /klipper/out/klipper.dict
gcode_dir: /gcode
