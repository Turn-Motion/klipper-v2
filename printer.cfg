[gcode_macro CALIBRATE_Z_OFFSET]
gcode:
    G90
    G0 X300 Y170 F3000         # move to probe point on the bed
    G0 Z10 A10 B10
    M400
    G4 P500
    PROBE                        # nozzle probe touch
    G0 Z50 A50 B50
    {% set z_probe = printer.probe.last_z_result %}
    SET_GCODE_OFFSET Z={z_probe} MOVE=1
    M118 Z correction applied: {z_probe}

[gcode_macro CHECK_EXTRUDER]
gcode:
  {% if printer.toolhead.extruder == "extruder" %}
    M118 T0
  {% elif printer.toolhead.extruder == "extruder1" %}
    M118 T1
  {% else %}
    M118 unknown active extruder
  {% endif %}

