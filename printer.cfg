[include mainsail.cfg]
[include probe.cfg]

########################################
# Stepper Motors
########################################

# S1
[stepper_z]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
microsteps: 16
rotation_distance: 5
endstop_pin: !PC15
homing_retract_dist: 0
position_endstop: 438.8
position_min: -90
position_max: 438.8
homing_speed: 5

# S2
[stepper_a]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 5
endstop_pin: !PF0
homing_retract_dist: 0
position_endstop: 439
position_min: -90
position_max: 439
homing_speed: 5

# S3
[stepper_b]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
microsteps: 16
rotation_distance: 5
endstop_pin: !PF1
homing_retract_dist: 0
position_endstop: 439.8
position_min: -90
position_max: 439.8
homing_speed: 5

# S4
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accesory such as an MMU
[stepper_y]
step_pin: PB9
dir_pin: PB8
enable_pin: !PB7
microsteps: 16
endstop_pin: !PF2
#endstop_pin: tmc5160_stepper_y:virtual_endstop
rotation_distance: 40
homing_retract_dist: 0
position_endstop: -97.4
position_min: -97.4
position_max: 280
homing_speed: 60

# S5
[stepper_x] #x0
step_pin: PG9
dir_pin: !PG10
enable_pin: !PG13
microsteps: 16
endstop_pin: !PF3
#endstop_pin: tmc5160_stepper_x:virtual_endstop
rotation_distance: 40
homing_retract_dist: 0
position_endstop: -32.5
position_min: -32.5
position_max: 570
homing_speed: 80

# S7
[dual_carriage] #x1
axis: x
#   The axis this extra carriage is on (either x or y). This parameter
#   must be provided.
safe_distance: 50
#   The minimum distance (in mm) to enforce between the dual and the primary
#   carriages. If a G-Code command is executed that will bring the carriages
#   closer than the specified limit, such a command will be rejected with an
#   error. If safe_distance is not provided, it will be inferred from
#   position_min and position_max for the dual and primary carriages. If set
#  to 0 (or safe_distance is unset and position_min and position_max are
#   identical for the primary and dual carriages), the carriages proximity
#   checks will be disabled.
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 16
endstop_pin: !PF4
#endstop_pin: tmc5160_dual_carriage:virtual_endstop
rotation_distance: 40
homing_retract_dist: 0
position_min: 50
position_max: 655
position_endstop: 655
homing_speed: 80

########################################
# Extruders
########################################

#[filament_switch_sensor material_2]
#switch_pin: PF10

# S6
[extruder]
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
microsteps: 16
rotation_distance: 8
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PF6 # HE0
sensor_pin:  PB0 # T0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -100
max_temp: 350
min_extrude_temp: -100

# S8
[extruder1]
step_pin: PG15
dir_pin: !PB6
enable_pin: !PG14
microsteps: 16
# rotation_distance: 8
rotation_distance: 7.44
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PF7 # HE1
sensor_type: EPCOS 100K B57560G104F
#sensor_type: PT1000
sensor_pin: PB1
#   Analog input pin connected to the sensor. This parameter must be
#   provided.
pullup_resistor: 4700
#   The resistance (in ohms) of the pullup attached to the sensor. The
#   default is 4700 ohms.
#sensor_type: EPCOS 100K B57560G104F
#sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -100
max_temp: 350
min_extrude_temp: -100

